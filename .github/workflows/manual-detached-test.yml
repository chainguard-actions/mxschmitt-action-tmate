name: Test detached mode
on: workflow_dispatch

permissions: {}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: ./detached
        with:
          connect-timeout-seconds: 60
      - run: |
          echo "A busy loop"
          for value in $(seq 10)
          do
            echo "Value: $value"
            echo "value $value" >>counter.txt
            sleep 1
          done
