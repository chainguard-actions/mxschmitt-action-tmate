name: Test skip dependency installation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: tmate
        uses: .
        continue-on-error: true
        with:
          detached: 'true'
          connect-timeout-seconds: '5'
          install-dependencies: 'false'
          sudo: 'auto'
      - name: Assert action ran with dependencies skipped
        env:
          OUTCOME: ${{ steps.tmate.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded without installing dependencies"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected when tmate is not installed and dependencies are skipped)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
