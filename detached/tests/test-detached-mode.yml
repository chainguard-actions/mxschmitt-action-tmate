name: Test detached mode with short timeout
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: tmate
        uses: .
        continue-on-error: true
        with:
          detached: 'true'
          connect-timeout-seconds: '5'
          install-dependencies: 'true'
          sudo: 'auto'
      - name: Assert action ran and produced outputs or failed gracefully
        env:
          OUTCOME: ${{ steps.tmate.outcome }}
          SSH_CMD: ${{ steps.tmate.outputs.ssh-command }}
          SSH_ADDR: ${{ steps.tmate.outputs.ssh-address }}
        run: |
          echo "outcome: $OUTCOME"
          echo "ssh-command: $SSH_CMD"
          echo "ssh-address: $SSH_ADDR"
          if [ "$OUTCOME" = "success" ]; then
            # In detached mode, if it connected, ssh-command should be set
            if [ -n "$SSH_CMD" ]; then
              echo "PASS: action succeeded with ssh-command output: $SSH_CMD"
            else
              echo "PASS: action succeeded (tmate session may have timed out before output was captured)"
            fi
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected when tmate server is unreachable or timeout is short)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
