name: Test custom tmate server configuration
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          detached: 'true'
          connect-timeout-seconds: '10'
          tmate-server-host: 'ssh.example.invalid'
          tmate-server-port: '2222'
          tmate-server-rsa-fingerprint: 'SHA256:fakefingerprint1234567890abcdef'
          tmate-server-ed25519-fingerprint: 'SHA256:fakefingerprint1234567890abcdef'
        continue-on-error: true
      - name: Assert action handled custom server config gracefully
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should accept the custom server inputs and attempt to
          # connect. Since the server is invalid, it will fail to connect,
          # but it must not crash with an unhandled JS error — only
          # 'success' or 'failure' are valid outcomes.
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action completed with outcome '$OUTCOME' (custom server)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
