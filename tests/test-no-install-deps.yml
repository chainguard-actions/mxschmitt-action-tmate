name: Test tmate skip dependency installation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Pre-install tmate dependencies manually
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq openssh-client xz-utils

      - id: tmate
        uses: .
        continue-on-error: true
        with:
          detached: 'true'
          connect-timeout-seconds: '30'
          install-dependencies: 'false'
          sudo: 'auto'

      - name: Assert action ran with install-dependencies false
        env:
          OUTCOME: ${{ steps.tmate.outcome }}
          SSH_CMD: ${{ steps.tmate.outputs.ssh-command }}
        run: |
          echo "outcome: $OUTCOME"
          echo "ssh-command: $SSH_CMD"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$SSH_CMD" ]; then
              echo "FAIL: action succeeded in detached mode but ssh-command output is empty"
              exit 1
            fi
            echo "PASS: action succeeded with install-dependencies=false, ssh-command='$SSH_CMD'"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (tmate server may be unreachable in test environment)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
