name: Test tmate without installing dependencies
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Pre-install tmate dependencies manually
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y openssh-client xz-utils
      - name: Start tmate with install-dependencies disabled
        id: action
        uses: .
        with:
          detached: 'true'
          install-dependencies: 'false'
          limit-access-to-actor: 'false'
          connect-timeout-seconds: '30'
        continue-on-error: true
      - name: Assert action ran with install-dependencies false
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: tmate started successfully without installing dependencies"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: tmate failed gracefully (expected in sandbox environment)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
      - name: Assert workflow continued
        run: |
          echo "PASS: workflow continued after tmate step"
