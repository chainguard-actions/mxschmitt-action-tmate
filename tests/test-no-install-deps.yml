name: Test skip install dependencies
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Pre-install tmate dependencies manually
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq openssh-client xz-utils
      - id: action
        uses: .
        with:
          detached: 'true'
          install-dependencies: 'false'
          connect-timeout-seconds: '10'
        continue-on-error: true
      - name: Assert action ran with install-dependencies disabled
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # With install-dependencies=false the action skips apt-get.
          # Since we pre-installed the deps, tmate should be able to start.
          # It may still fail to connect to the tmate server (network),
          # but it must not crash with an unhandled error.
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action completed with outcome '$OUTCOME'"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
