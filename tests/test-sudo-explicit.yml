name: Test tmate with explicit sudo setting
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Start tmate with explicit sudo true
        id: action
        uses: .
        with:
          detached: 'true'
          sudo: 'true'
          limit-access-to-actor: 'false'
          connect-timeout-seconds: '30'
        continue-on-error: true
      - name: Assert action ran with sudo true
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: tmate started successfully with sudo=true"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: tmate failed gracefully (expected in sandbox environment)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
      - name: Assert workflow continued
        run: |
          echo "PASS: workflow continued after tmate step with sudo=true"
